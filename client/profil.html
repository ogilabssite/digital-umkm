<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Toko - Kasir Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-24">

    <div class="bg-white p-6 rounded-b-[40px] shadow-sm border-b border-gray-100 mb-6">
        <h1 class="text-2xl font-black text-gray-800">Profil Toko</h1>
        <p class="text-xs text-gray-400 font-bold uppercase tracking-widest">Pengaturan Identitas Bisnis</p>
    </div>

    <div class="px-6 space-y-6">
        <div class="bg-white p-6 rounded-[32px] shadow-sm border border-gray-100">
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-2">Nama Toko / Cafe</label>
                    <input type="text" id="set-nama-toko" class="w-full p-4 bg-gray-50 rounded-2xl border-none mt-1 focus:ring-2 focus:ring-green-500" placeholder="Contoh: Kopi Kenangan">
                </div>
                
                <div>
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-2">Alamat Lengkap</label>
                    <textarea id="set-alamat" rows="3" class="w-full p-4 bg-gray-50 rounded-2xl border-none mt-1 focus:ring-2 focus:ring-green-500" placeholder="Jl. Merdeka No. 123..."></textarea>
                </div>

                <div>
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-2">No. WhatsApp (Awali 62)</label>
                    <input type="number" id="set-wa" class="w-full p-4 bg-gray-50 rounded-2xl border-none mt-1 focus:ring-2 focus:ring-green-500" placeholder="628123456789">
                </div>
            </div>

            <button onclick="updateProfile()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold mt-8 shadow-lg shadow-green-100 active:scale-95 transition-all">
                Simpan Perubahan
            </button>
        </div>

        <div class="bg-blue-50 p-6 rounded-[32px] border border-blue-100">
            <p class="text-blue-600 text-xs font-medium leading-relaxed">
                ℹ️ Informasi di atas akan otomatis muncul pada <b>Struk PDF</b> dan pesan <b>WhatsApp</b> yang dikirim ke pelanggan.
            </p>
        </div>
    </div>

    <div class="fixed bottom-6 left-6 right-6 bg-white/90 backdrop-blur-xl h-20 rounded-[30px] shadow-2xl border border-white/20 flex items-center justify-around px-4 z-40">
        <a href="index.html" class="flex flex-col items-center gap-1 text-gray-300">
            <span class="text-2xl">📄</span>
            <span class="text-[9px] font-black uppercase tracking-tighter">Kasir</span>
        </a>
        <a href="dashboard.html" class="flex flex-col items-center gap-1 text-gray-300">
            <span class="text-2xl">📊</span>
            <span class="text-[9px] font-black uppercase tracking-tighter">Laporan</span>
        </a>
        <a href="transaksi.html" class="flex flex-col items-center gap-1 text-gray-300">
            <span class="text-2xl">🔄</span>
            <span class="text-[9px] font-black uppercase tracking-tighter">Produk</span>
        </a>
        <a href="profil.html" class="flex flex-col items-center gap-1 text-green-600">
            <span class="text-2xl">👤</span>
            <span class="text-[9px] font-black uppercase tracking-tighter">Profil</span>
        </a>
    </div>

    <div id="notification" class="fixed top-10 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full text-xs font-bold shadow-2xl opacity-0 transition-all pointer-events-none z-[60]"></div>

    <script src="js/app.js"></script>
    <script>
        // Fungsi khusus untuk simpan profil ke LocalStorage
        function updateProfile() {
            const nama = document.getElementById('set-nama-toko').value;
            const alamat = document.getElementById('set-alamat').value;
            const wa = document.getElementById('set-wa').value;

            if(!nama || !wa) return showNotification("❌ Nama & WA wajib diisi");

            localStorage.setItem('nama_cafe', nama);
            localStorage.setItem('alamat_toko', alamat);
            localStorage.setItem('no_whatsapp', wa);

            showNotification("✅ Profil Berhasil Diperbarui!");
            
            // Beri jeda sedikit lalu refresh agar nama cafe di header berubah
            setTimeout(() => { location.reload(); }, 1000);
        }
    </script>
</body>
</html>
